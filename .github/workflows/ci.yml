name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Syntax & Compilation Validation
        run: |
          python -m py_compile main.py run.py sync_token.py config/*.py core/*.py handlers/*.py utils/*.py

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

      - name: Smoke Test CLI Dry-Run
        env:
          PYTHONPATH: .
        run: |
          python main.py sample-target --dry-run

  docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t async-web-automation-engine:latest .

      - name: Verify Docker Container CLI
        run: |
          docker run --rm async-web-automation-engine:latest --help
